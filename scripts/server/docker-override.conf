[Service]
# ExecStartPost re-applies wg0-up-extra.sh's routes/rules after dockerd
# itself (re)starts. Found 2026-09-04: a docker engine upgrade restarted
# docker.service, which rebuilds every bridge network's interface as part
# of its own container-restoration startup -- br-pihole came back as a new
# link, silently invalidating table 200's route to it (172.25.0.0/24 dev
# br-pihole), since that route is only ever (re-)added by wg0-up-extra.sh,
# which normally runs via wg-quick@wg0's PostUp. wg0 itself was untouched
# by the docker restart, so nothing re-ran it -- the DNS-via-exit-node path
# (mangle PREROUTING marks Tailscale-client DNS 0x200 before Pi-hole's
# RETURN rule sees it) silently broke for ~12h until
# vpn-dns-regression-check.sh's hourly ntfy alerts got noticed.
#
# Same "service X restarting silently breaks something only wg0-up-extra.sh
# restores" gap as tailscaled.service.d/override.conf (2026-08-19, a bare
# tailscaled restart dropping the exit-node kill switch) -- this is the 4th
# distinct trigger path found for this general class of issue. Calls the
# same single source of truth rather than re-typing just the one route this
# incident happened to hit; wg0-up-extra.sh is idempotent and cheap, and
# docker.service only restarts on daemon-level events (engine upgrades,
# manual restarts, crashes), not on every `docker compose up`.
#
# Waits (best-effort) for wg0 to exist first: docker.service and
# wg-quick@wg0.service have no ordering relationship, so either can start
# first at boot. If wg0 never appears in the timeout, wg0-up-extra.sh still
# runs (a no-op for the wg0-dependent routes) -- wg-quick@wg0's own later
# PostUp re-applies everything once it does come up, same tolerant idiom as
# wg0-up-extra.sh's own wait_for_chain().
ExecStartPost=/bin/bash -c 'for i in $(seq 1 30); do ip link show wg0 >/dev/null 2>&1 && break; sleep 1; done; /usr/local/bin/wg0-up-extra.sh'
