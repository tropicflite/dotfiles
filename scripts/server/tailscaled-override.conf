[Unit]
After=network-online.target
Wants=network-online.target

# ExecStartPost re-applies rules that `tailscale up` clobbers on every start,
# since it recreates its own ts-forward chain from scratch and re-inserts it
# at FORWARD position 1: the IPv6-REJECT and exit-node-kill-switch (mark 0x200
# DROP) rules must sit ahead of ts-forward's own blanket ACCEPT, so each is
# installed BOTH in FORWARD and inside ts-forward itself — the inner copy is
# what survives tailscaled reasserting position 1. Matches wg0-up-extra.sh's
# copy of the same rules (that script's comments have the full rationale);
# this override exists because a bare `systemctl restart tailscaled` (with
# wg0 untouched) doesn't trigger wg0-up-extra.sh, so nothing else re-applies
# them. Gap found + fixed 2026-08-19: a tailscaled-only restart silently
# dropped the exit-node kill switch for ~6min with no alert.
[Service]
ExecStartPost=/bin/bash -c 'for i in $(seq 1 30); do tailscale status >/dev/null 2>&1 && break; sleep 1; done; tailscale up --hostname=server --advertise-routes=10.0.0.0/24,192.168.50.0/24 --operator=matt --accept-dns=false --advertise-exit-node; ip6tables -D FORWARD -i tailscale0 ! -o tailscale0 -j REJECT 2>/dev/null; ip6tables -I FORWARD 1 -i tailscale0 ! -o tailscale0 -j REJECT; ip6tables -D ts-forward -i tailscale0 ! -o tailscale0 -j REJECT 2>/dev/null; ip6tables -I ts-forward 1 -i tailscale0 ! -o tailscale0 -j REJECT; iptables -D FORWARD -m mark --mark 0x200 ! -o wg0 -j DROP 2>/dev/null; iptables -I FORWARD 1 -m mark --mark 0x200 ! -o wg0 -j DROP; iptables -D ts-forward -m mark --mark 0x200 ! -o wg0 -j DROP 2>/dev/null; iptables -I ts-forward 1 -m mark --mark 0x200 ! -o wg0 -j DROP'
