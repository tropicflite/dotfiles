[Unit]
After=network-online.target
Wants=network-online.target

# ExecStartPost re-applies rules that `tailscale up` clobbers on every start,
# since it recreates its own ts-forward chain from scratch and re-inserts it
# at FORWARD position 1: the IPv6-REJECT and exit-node-kill-switch (mark 0x200
# DROP) rules must sit ahead of ts-forward's own blanket ACCEPT, so each is
# installed BOTH in FORWARD and inside ts-forward itself — the inner copy is
# what survives tailscaled reasserting position 1. This override exists
# because a bare `systemctl restart tailscaled` (with wg0 untouched) doesn't
# trigger wg0-up-extra.sh, so nothing else re-applies them. Gap found + fixed
# 2026-08-19: a tailscaled-only restart silently dropped the exit-node kill
# switch for ~6min with no alert.
#
# CONSOLIDATED 2026-08-31 (code review finding): this used to carry its own
# inline duplicate of just the 4 ts-forward/FORWARD rules, re-typed separately
# from wg0-up-extra.sh's copy of the same rules. wg-watchdog.sh gained a
# second call site that day (its own TS-coordination-restart path calls
# wg0-up-extra.sh directly for the identical race) — leaving two
# independently-maintained copies of "reinsert these rules after tailscale
# restarts" was exactly the sibling-bug-instance risk this repo's history has
# hit before: edit one rule's text in wg0-up-extra.sh and forget this file,
# and the 2026-08-19 gap silently comes back on this trigger path specifically.
# Now calls wg0-up-extra.sh itself instead — one source of truth, same as the
# wg-watchdog.sh call site. wg0-up-extra.sh also does more than these 4 rules
# (main-table route, table 200, NAT-PMP, DNS bypass) which isn't strictly
# needed here since wg0 itself is untouched by a tailscaled restart, but it's
# idempotent and cheap, and matching call sites beats a narrower-but-divergent
# one. wg0-up-extra.sh's own wait_for_chain() (added same day) covers the
# chain-not-recreated-yet race this inline version didn't guard against either.
[Service]
ExecStartPost=/bin/bash -c 'for i in $(seq 1 30); do tailscale status >/dev/null 2>&1 && break; sleep 1; done; tailscale up --hostname=server --advertise-routes=10.0.0.0/24,192.168.50.0/24 --operator=matt --accept-dns=false --advertise-exit-node; /usr/local/bin/wg0-up-extra.sh'
