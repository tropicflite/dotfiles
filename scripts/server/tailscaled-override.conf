[Unit]
After=network-online.target
Wants=network-online.target

[Service]
ExecStartPost=/bin/bash -c 'for i in $(seq 1 30); do tailscale status >/dev/null 2>&1 && break; sleep 1; done; tailscale up --hostname=server --advertise-routes=10.0.0.0/24,192.168.50.0/24 --operator=matt --accept-dns=false --advertise-exit-node; ip6tables -D FORWARD -i tailscale0 ! -o tailscale0 -j REJECT 2>/dev/null; ip6tables -I FORWARD 1 -i tailscale0 ! -o tailscale0 -j REJECT; ip6tables -D ts-forward -i tailscale0 ! -o tailscale0 -j REJECT 2>/dev/null; ip6tables -I ts-forward 1 -i tailscale0 ! -o tailscale0 -j REJECT'
